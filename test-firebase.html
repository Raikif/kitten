<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f0f0;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        #log {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <h1>🔥 Firebase Connection Test</h1>
    
    <div id="firebase-status" class="status info">
        Checking Firebase connection...
    </div>
    
    <div>
        <button onclick="testCreateRoom()">Test: Create Room</button>
        <button onclick="testJoinRoom()">Test: Join Room</button>
        <button onclick="testReadRooms()">Test: Read Rooms</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div id="log">
        <div class="log-entry">Ready for testing...</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script>
        let testRoomCode = '';
        
        // Wait for Firebase
        window.addEventListener('firebaseReady', () => {
            log('✅ Firebase initialized successfully!');
            updateStatus('✅ Firebase Connected', 'success');
        });
        
        // Initialize Firebase on load
        if (typeof firebase !== 'undefined') {
            try {
                initFirebase();
            } catch(e) {
                log('❌ Firebase init error: ' + e.message, 'error');
                updateStatus('❌ Firebase Error: ' + e.message, 'error');
            }
        } else {
            log('❌ Firebase library not loaded', 'error');
            updateStatus('❌ Firebase library not loaded', 'error');
        }
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            logDiv.insertBefore(entry, logDiv.firstChild);
        }
        
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('firebase-status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
        
        async function testCreateRoom() {
            try {
                testRoomCode = generateRoomCode();
                log(`Creating test room: ${testRoomCode}`);
                
                const roomRef = db.ref('rooms/' + testRoomCode);
                await roomRef.set({
                    code: testRoomCode,
                    status: 'testing',
                    createdAt: Date.now(),
                    testData: 'This is a test room'
                });
                
                log(`✅ Room created successfully: ${testRoomCode}`, 'success');
                updateStatus(`✅ Test Room Created: ${testRoomCode}`, 'success');
            } catch (error) {
                log(`❌ Create room error: ${error.message}`, 'error');
                updateStatus(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function testJoinRoom() {
            if (!testRoomCode) {
                log('⚠️ Please create a room first');
                return;
            }
            
            try {
                log(`Attempting to join room: ${testRoomCode}`);
                
                const roomRef = db.ref('rooms/' + testRoomCode);
                const snapshot = await roomRef.once('value');
                
                if (snapshot.exists()) {
                    const roomData = snapshot.val();
                    log(`✅ Room found! Status: ${roomData.status}`);
                    log(`Room data: ${JSON.stringify(roomData, null, 2)}`);
                    updateStatus(`✅ Successfully joined room ${testRoomCode}`, 'success');
                } else {
                    log(`❌ Room not found: ${testRoomCode}`);
                    updateStatus(`❌ Room not found`, 'error');
                }
            } catch (error) {
                log(`❌ Join room error: ${error.message}`, 'error');
                updateStatus(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function testReadRooms() {
            try {
                log('Reading all rooms from database...');
                
                const roomsRef = db.ref('rooms');
                const snapshot = await roomsRef.once('value');
                
                if (snapshot.exists()) {
                    const rooms = snapshot.val();
                    const roomCount = Object.keys(rooms).length;
                    log(`✅ Found ${roomCount} room(s)`);
                    
                    Object.entries(rooms).forEach(([code, data]) => {
                        log(`  - Room ${code}: ${data.status || 'unknown'} (${new Date(data.createdAt).toLocaleString()})`);
                    });
                    
                    updateStatus(`✅ Found ${roomCount} room(s)`, 'success');
                } else {
                    log('No rooms found in database');
                    updateStatus('ℹ️ No rooms in database', 'info');
                }
            } catch (error) {
                log(`❌ Read rooms error: ${error.message}`, 'error');
                updateStatus(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '<div class="log-entry">Log cleared...</div>';
        }
    </script>
</body>
</html>
